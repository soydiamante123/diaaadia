<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Día a Día</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F3EE;--surface:#FFFFFF;--surface2:#EFEFEB;--surface3:#E8E6E0;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
  --text:#1A1A18;--text2:#6B6B64;--text3:#9E9E96;
  --green:#4A7C3F;--green-l:#EAF2E7;--green-m:#C5DFC0;
  --purple:#5B4FCF;--purple-l:#EEEDFE;
  --teal:#2A7A65;--teal-l:#E2F4EF;
  --amber:#A06B10;--amber-l:#FEF3E2;
  --coral:#B04030;--coral-l:#FCECEA;
  --blue:#1A6FA8;--blue-l:#E6F1FB;
  --radius:14px;--radius-sm:9px;--radius-xs:6px;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --nav-h:56px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#111110;--surface:#1C1B19;--surface2:#242320;--surface3:#2C2B28;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#F0EEE8;--text2:#9E9C94;--text3:#65645E;
  --green:#6BBF5E;--green-l:#162813;--green-m:#234020;
  --purple:#8B80EF;--purple-l:#1A1740;
  --teal:#4BBFA0;--teal-l:#0E2820;
  --amber:#D4960A;--amber-l:#231A06;
  --coral:#E07060;--coral-l:#251008;
  --blue:#4CA3D8;--blue-l:#0C2035;
}}
html{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}
body{max-width:540px;margin:0 auto;padding-bottom:calc(var(--nav-h) + 16px)}

/* NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:540px;height:var(--nav-h);background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;z-index:50;padding:0 8px}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:8px 16px;border-radius:var(--radius-sm);color:var(--text3);font-size:10px;font-family:var(--mono);letter-spacing:0.04em;transition:all .15s;flex:1}
.nav-btn.active{color:var(--green)}
.nav-btn svg{width:22px;height:22px;stroke-width:1.5}

/* HEADER */
.page-header{padding:20px 16px 12px;display:flex;align-items:center;justify-content:space-between}
.page-title{font-size:22px;font-weight:600;letter-spacing:-0.03em}
.page-title span{color:var(--green)}
.header-right{display:flex;align-items:center;gap:8px}
.today-chip{font-size:11px;font-family:var(--mono);color:var(--text2);background:var(--surface2);padding:5px 10px;border-radius:20px;border:1px solid var(--border)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);transition:background .3s;flex-shrink:0}
.sync-dot.ok{background:var(--green)}
.sync-dot.err{background:#E24B4A}
.sync-dot.loading{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* PAGES */
.page{display:none;min-height:calc(100vh - var(--nav-h))}
.page.active{display:block}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px;margin-bottom:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.stat-label{font-size:10px;color:var(--text3);margin-bottom:3px;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase}
.stat-val{font-size:21px;font-weight:600;letter-spacing:-0.02em}
.stat-val.green{color:var(--green)}

/* PROGRESS */
.progress-wrap{padding:0 16px;margin-bottom:20px}
.progress-label{display:flex;justify-content:space-between;margin-bottom:5px}
.progress-label span{font-size:12px;color:var(--text2)}
.progress-track{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);border-radius:3px;transition:width .4s cubic-bezier(.4,0,.2,1)}

/* SECTION */
.section{padding:0 16px;margin-bottom:20px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.section-head h2{font-size:12px;font-weight:500;color:var(--text2);font-family:var(--mono);text-transform:uppercase;letter-spacing:.07em}
.add-btn{display:flex;align-items:center;gap:3px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-xs);padding:5px 11px;font-size:11px;font-family:var(--font);font-weight:500;cursor:pointer;transition:opacity .15s}
.add-btn:hover{opacity:.85}
.add-btn.secondary{background:var(--blue);color:#fff}

/* HABITS */
.habit-list{display:flex;flex-direction:column;gap:4px}
.habit-row{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;user-select:none}
.habit-row:hover{border-color:var(--border2)}
.habit-row.checked{border-color:transparent}
.habit-check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-size:10px;color:#fff}
.habit-name{flex:1;font-size:13px;color:var(--text);transition:all .15s}
.habit-time{font-size:11px;font-family:var(--mono);color:var(--text3);flex-shrink:0}
.habit-row.checked .habit-name{text-decoration:line-through;color:var(--text3)}
.habit-cat{font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:20px;flex-shrink:0}
.habit-actions{display:flex;gap:2px;opacity:0;transition:opacity .15s;flex-shrink:0}
.habit-row:hover .habit-actions,.habit-row:focus-within .habit-actions{opacity:1}
.act-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:14px;padding:3px 4px;border-radius:4px;transition:all .15s}
.act-btn:hover{color:var(--text);background:var(--surface2)}

/* CALENDAR PAGE */
.cal-controls{padding:0 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav button{background:var(--surface2);border:1px solid var(--border);border-radius:6px;width:28px;height:28px;cursor:pointer;color:var(--text);font-size:15px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.month-nav button:hover{background:var(--border2)}
.month-name{font-size:14px;font-weight:500;color:var(--text);min-width:130px;text-align:center}
.view-toggle{display:flex;background:var(--surface2);border-radius:var(--radius-xs);border:1px solid var(--border);overflow:hidden}
.view-btn{background:none;border:none;cursor:pointer;padding:5px 12px;font-size:11px;font-family:var(--mono);color:var(--text2);transition:all .15s}
.view-btn.active{background:var(--surface);color:var(--text);font-weight:500}

/* MONTH VIEW */
.month-view{padding:0 16px}
.weekdays-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
.weekday-label{text-align:center;font-size:10px;color:var(--text3);font-family:var(--mono);padding:2px 0}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:16px}
.month-cell{aspect-ratio:1;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:all .15s;border:1px solid transparent}
.month-cell:hover{background:var(--surface2)}
.month-cell.today{border-color:var(--green)}
.month-cell.selected{background:var(--green);color:#fff}
.month-cell.selected .cell-num{color:#fff}
.month-cell.has-habits{background:var(--green-l)}
.month-cell.has-habits.selected{background:var(--green)}
.month-cell.empty{opacity:0;pointer-events:none}
.cell-num{font-size:12px;font-family:var(--mono);color:var(--text2)}
.month-cell.today .cell-num{color:var(--green);font-weight:600}
.cell-dots{display:flex;gap:2px;margin-top:2px}
.cell-dot{width:4px;height:4px;border-radius:50%}

/* DAY VIEW */
.day-view{padding:0 16px}
.day-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.day-nav-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;width:28px;height:28px;cursor:pointer;color:var(--text);font-size:15px;display:flex;align-items:center;justify-content:center}
.day-title{font-size:15px;font-weight:500;color:var(--text);flex:1;text-align:center}
.day-subtitle{font-size:11px;color:var(--text3);font-family:var(--mono)}

.timeline{position:relative}
.time-block{display:flex;gap:10px;margin-bottom:2px;min-height:44px}
.time-label{width:40px;font-size:10px;font-family:var(--mono);color:var(--text3);padding-top:14px;flex-shrink:0;text-align:right}
.time-events{flex:1;border-left:1px solid var(--border);padding-left:10px;padding-bottom:4px;min-height:44px;position:relative}
.time-events:hover .time-add-btn{opacity:1}
.time-add-btn{position:absolute;top:10px;right:4px;background:none;border:1px dashed var(--border2);border-radius:4px;padding:2px 6px;font-size:10px;color:var(--text3);cursor:pointer;opacity:0;transition:opacity .15s}
.time-add-btn:hover{background:var(--surface2);opacity:1}

.event-chip{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:var(--radius-xs);margin-bottom:3px;cursor:pointer;transition:all .15s;border:1px solid transparent;position:relative}
.event-chip:hover{filter:brightness(.95)}
.event-chip:hover .event-del{opacity:1}
.event-title{font-size:12px;font-weight:500;flex:1}
.event-time-tag{font-size:10px;font-family:var(--mono);opacity:.7}
.event-del{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:12px;opacity:0;transition:opacity .15s;color:inherit;padding:2px}

/* HABITS DAY PANEL */
.day-habits-panel{margin-top:16px;margin-bottom:16px}
.day-habits-list{display:flex;flex-direction:column;gap:3px}
.day-habit-row{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xs);cursor:pointer;transition:all .15s}
.day-habit-row.checked{border-color:transparent}
.day-habit-check{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;flex-shrink:0;transition:all .2s}
.day-habit-name{font-size:12px;color:var(--text);flex:1}
.day-habit-row.checked .day-habit-name{text-decoration:line-through;color:var(--text3)}
.day-habit-time{font-size:10px;font-family:var(--mono);color:var(--text3)}

/* UPCOMING */
.upcoming-list{display:flex;flex-direction:column;gap:6px}
.upcoming-item{display:flex;gap:10px;padding:10px 13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);align-items:flex-start}
.upcoming-date-col{text-align:center;min-width:36px}
.upcoming-day{font-size:18px;font-weight:600;color:var(--green);letter-spacing:-0.02em;line-height:1}
.upcoming-month{font-size:9px;font-family:var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.upcoming-info{flex:1}
.upcoming-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:2px}
.upcoming-meta{font-size:11px;color:var(--text3);font-family:var(--mono)}
.upcoming-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;padding:2px;opacity:0;transition:opacity .15s}
.upcoming-item:hover .upcoming-del{opacity:1}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:flex-end;justify-content:center;z-index:200;padding:0;backdrop-filter:blur(3px)}
.modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;padding:22px 20px 32px;width:100%;max-width:540px;max-height:85vh;overflow-y:auto}
.modal-handle{width:36px;height:4px;background:var(--surface3);border-radius:2px;margin:0 auto 18px}
.modal h3{font-size:16px;font-weight:600;margin-bottom:18px;color:var(--text)}
.field-label{font-size:11px;font-family:var(--mono);color:var(--text2);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px}
.field-group{margin-bottom:14px}
.modal input,.modal select,.modal textarea{width:100%;padding:10px 12px;font-size:14px;font-family:var(--font);border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);outline:none;-webkit-appearance:none}
.modal input:focus,.modal select:focus{border-color:var(--green)}
.modal textarea{resize:vertical;min-height:72px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.btn-save{background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);padding:10px 22px;font-size:13px;font-family:var(--font);font-weight:500;cursor:pointer;transition:opacity .15s}
.btn-save:hover{opacity:.85}
.btn-cancel{background:none;border:1px solid var(--border2);border-radius:var(--radius-sm);padding:10px 16px;font-size:13px;font-family:var(--font);cursor:pointer;color:var(--text2)}
.btn-cancel:hover{background:var(--surface2)}

/* COLOR PICKER */
.color-picker{display:flex;gap:8px;flex-wrap:wrap}
.color-opt{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.color-opt.selected{border-color:var(--text);transform:scale(1.15)}

/* TOAST */
.toast{position:fixed;bottom:calc(var(--nav-h) + 12px);left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:var(--bg);font-size:13px;padding:10px 18px;border-radius:20px;transition:transform .3s;z-index:300;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}

.empty-state{text-align:center;padding:32px 20px;color:var(--text3);font-size:13px}
.divider{height:1px;background:var(--border);margin:16px 0}
</style>
</head>

<!-- NAV -->
<nav class="nav">
  <button class="nav-btn active" id="nav-hoy" onclick="showPage('hoy')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M3 12h2m14 0h2M12 3v2m0 14v2"/></svg>

  </button>
  <button class="nav-btn" id="nav-cal" onclick="showPage('cal')">

    Hábitos
  </button>
</nav>

<!-- PAGE: HOY -->
<div class="page active" id="page-hoy">
  <div class="page-header">
    <div class="page-title">día<span>.</span>a<span>.</span>día</div>
    <div class="header-right">
      <div class="sync-dot loading" id="sync-dot" title="Estado de sincronización"></div>
      <div class="today-chip" id="today-chip"></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card"><div class="stat-label">Hoy</div><div class="stat-val green" id="stat-today">0%</div></div>
    <div class="stat-card"><div class="stat-label">Racha</div><div class="stat-val" id="stat-streak">0d</div></div>
    <div class="stat-card"><div class="stat-label">Mes</div><div class="stat-val" id="stat-month">0%</div></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-label">
      <span id="progress-text">Cargando...</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>

  <div class="section">
    <div class="section-head">
      <h2>Hábitos de hoy</h2>
      <button class="add-btn" onclick="openHabitModal()">+ Hábito</button>
    </div>
    <div class="habit-list" id="today-habit-list"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <h2>Eventos de hoy</h2>
      <button class="add-btn secondary" onclick="openEventModal(todayISO())">+ Evento</button>
    </div>
    <div id="today-events-list"></div>
  </div>

  <div class="section">
    <div class="section-head"><h2>Próximos eventos</h2></div>
    <div id="upcoming-list"></div>
  </div>
</div>

<!-- PAGE: AGENDA/CALENDARIO -->
<div class="page" id="page-cal">
  <div class="page-header">
    <div class="page-title">Agenda</div>
    <div class="header-right">
      <button class="add-btn secondary" onclick="openEventModal(selectedDayISO())">+ Evento</button>
    </div>
  </div>

  <div class="cal-controls">
    <div class="month-nav">
      <button onclick="changeCalMonth(-1)">&#8249;</button>
      <span class="month-name" id="cal-month-name"></span>
      <button onclick="changeCalMonth(1)">&#8250;</button>
    </div>
    <div class="view-toggle">
      <button class="view-btn active" id="vbtn-month" onclick="setCalView('month')">Mes</button>
      <button class="view-btn" id="vbtn-day" onclick="setCalView('day')">Día</button>
    </div>
  </div>

  <div id="month-view-wrap" class="month-view">
    <div class="weekdays-row">
      <div class="weekday-label">Do</div><div class="weekday-label">Lu</div><div class="weekday-label">Ma</div>
      <div class="weekday-label">Mi</div><div class="weekday-label">Ju</div><div class="weekday-label">Vi</div>
      <div class="weekday-label">Sa</div>
    </div>
    <div class="month-grid" id="month-grid"></div>
    <div id="month-day-detail"></div>
  </div>

  <div id="day-view-wrap" class="day-view" style="display:none">
    <div class="day-header">
      <button class="day-nav-btn" onclick="changeSelectedDay(-1)">&#8249;</button>
      <div>
        <div class="day-title" id="day-view-title"></div>
        <div class="day-subtitle" id="day-view-subtitle"></div>
      </div>
      <button class="day-nav-btn" onclick="changeSelectedDay(1)">&#8250;</button>
    </div>
    <div id="day-view-content"></div>
  </div>
</div>

<!-- PAGE: HÁBITOS -->
<div class="page" id="page-habitos">
  <div class="page-header">
    <div class="page-title">Hábitos</div>
    <button class="add-btn" onclick="openHabitModal()">+ Agregar</button>
  </div>
  <div class="section">
    <div class="habit-list" id="all-habit-list"></div>
  </div>
</div>

<div id="modal-container"></div>
<div class="toast" id="toast"></div>

// ── DATE HELPERS ─────────────────────────────────────────────
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function selectedDayISO(){ return S.selectedDay || todayISO(); }
function isoToDate(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function dateToISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function formatDayLabel(iso){
  const d = isoToDate(iso);
  const days=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const months=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
}
function formatMonthYear(y,m){
  const months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return `${months[m]} ${y}`;
}

// ── STORAGE ──────────────────────────────────────────────────
function cacheLoad(){
  try{const s=localStorage.getItem('diadia_v2');if(s){const p=JSON.parse(s);Object.assign(S,p);S.calYear=new Date().getFullYear();S.calMonth=new Date().getMonth();}}catch(e){}
}
function cacheSave(){
  try{localStorage.setItem('diadia_v2',JSON.stringify({habits:S.habits,log:S.log,events:S.events,nextHabitId:S.nextHabitId,nextEventId:S.nextEventId}));}catch(e){}
}

function setSyncStatus(st){
  const d=document.getElementById('sync-dot');
  if(d){d.className='sync-dot '+st;}
}

async function syncFromSheet(){
  setSyncStatus('loading');
  try{
    const res=await fetch(SCRIPT_URL+'?v='+Date.now());
    const data=await res.json();
    if(data&&data.habits){Object.assign(S,{habits:data.habits,log:data.log||{},events:data.events||{},nextHabitId:data.nextHabitId||15,nextEventId:data.nextEventId||1});}
    else{
      const vals=Object.values(data||{});
      if(vals.length){const latest=vals[vals.length-1];if(latest&&latest.habits)Object.assign(S,{habits:latest.habits,log:latest.log||{},events:latest.events||{},nextHabitId:latest.nextHabitId||15,nextEventId:latest.nextEventId||1});}
    }
    cacheSave(); setSyncStatus('ok'); render();
    scheduleNotifications();
  }catch(e){setSyncStatus('err');}
}

function scheduleSave(){
  clearTimeout(syncTimer);
  cacheSave();
  syncTimer=setTimeout(async()=>{
    setSyncStatus('loading');
    try{
      await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'save',key:'main',habits:S.habits,log:S.log,events:S.events,nextHabitId:S.nextHabitId,nextEventId:S.nextEventId})});
      setSyncStatus('ok');
    }catch(e){setSyncStatus('err');}
  },1500);
}

// ── NOTIFICATIONS ─────────────────────────────────────────────
async function requestNotifPerms(){
  if(!('Notification' in window)) return;
  if(Notification.permission==='default') await Notification.requestPermission();
}
function scheduleNotifications(){
  Object.values(notifScheduled).forEach(clearTimeout);
  notifScheduled={};
  const now=new Date();
  Object.entries(S.events).forEach(([iso,evts])=>{
    evts.forEach(ev=>{
      if(!ev.remind||!ev.time) return;
      const [h,m]=ev.time.split(':').map(Number);
      const evDate=isoToDate(iso);
      evDate.setHours(h,m-15,0,0);
      const diff=evDate-now;
      if(diff>0&&diff<86400000*7){
        notifScheduled[ev.id]=setTimeout(()=>{
          if(Notification.permission==='granted'){
            new Notification('Día a Día — '+ev.title,{body:`En 15 min · ${ev.time}`,icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="%234A7C3F"/></svg>'});
          }
        },diff);
      }
    });
  });
}

// ── HABITS ───────────────────────────────────────────────────
function toggleHabit(id, iso){
  const key=iso||todayISO();
  if(!S.log[key]) S.log[key]=[];
  const idx=S.log[key].indexOf(id);
  if(idx===-1){S.log[key].push(id);showToast('✓ Completado');}
  else{S.log[key].splice(idx,1);showToast('Desmarcado');}
  scheduleSave(); render();
}

function getChecked(iso){ return S.log[iso||todayISO()]||[]; }

function getStreak(){
  let streak=0,today=new Date();
  for(let i=0;i<365;i++){
    const d=new Date(today);d.setDate(d.getDate()-i);
    if((S.log[dateToISO(d)]||[]).length>0) streak++;
    else if(i>0) break;
  }
  return streak;
}

function getMonthPct(){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  const days=new Date(y,m+1,0).getDate();
  let total=0,count=0;
  for(let d=1;d<=days;d++){
    if(d>now.getDate()) break;
    const iso=dateToISO(new Date(y,m,d));
    const done=(S.log[iso]||[]).length;
    if(done>0||(d===now.getDate())){total+=done/Math.max(S.habits.length,1);count++;}
  }
  return count>0?Math.round((total/count)*100):0;
}

function renderCalendar(){

  if(S.calView==='month'){
    renderMonthGrid();
    renderMonthDayDetail();

  }

function renderMonthGrid(){
  const y=S.calYear,m=S.calMonth;
  const today=new Date();
  const firstDay=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const grid=document.getElementById('month-grid');
  grid.innerHTML='';

  for(let i=0;i<firstDay;i++){const el=document.createElement('div');el.className='month-cell empty';grid.appendChild(el);}

  for(let d=1;d<=daysInMonth;d++){
    const iso=dateToISO(new Date(y,m,d));
    const evts=S.events[iso]||[];
    const habDone=(S.log[iso]||[]).length>0;
    const isToday=today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d;
    const isSelected=iso===S.selectedDay;

    const cell=document.createElement('div');
    let cls='month-cell';
    if(isToday) cls+=' today';
    if(isSelected) cls+=' selected';
    else if(habDone) cls+=' has-habits';
    cell.className=cls;

    let dotsHTML='';
    if(evts.length){
      const dotCols=evts.slice(0,3).map(ev=>{
        const col=EVENT_COLORS.find(c=>c.id===ev.color)||EVENT_COLORS[0];
        return `<div class="cell-dot" style="background:${isSelected?'rgba(255,255,255,0.8)':col.hex}"></div>`;
      }).join('');
      dotsHTML=`<div class="cell-dots">${dotCols}</div>`;
    }
    cell.innerHTML=`<span class="cell-num">${d}</span>${dotsHTML}`;
    cell.onclick=()=>{S.selectedDay=iso;renderCalendar();};
    grid.appendChild(cell);
  }
}

// ── HABIT MODAL ──────────────────────────────────────────────
function openHabitModal(habit){
  const catOpts=Object.entries(CAT).map(([k,v])=>`<option value="${k}"${habit&&habit.cat===k?' selected':''}>${v.label}</option>`).join('');
  document.getElementById('modal-container').innerHTML=`
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-handle"></div>
        <h3>${habit?'Editar hábito':'Nuevo hábito'}</h3>
        <div class="field-group"><label class="field-label">Nombre</label>
          <input id="m-name" placeholder="Ej: Meditar 10 min" value="${habit?habit.name:''}"/></div>
        <div class="row-2">
          <div class="field-group"><label class="field-label">Hora (opcional)</label>
            <input id="m-time" type="time" value="${habit&&habit.time?habit.time:''}"/></div>
          <div class="field-group"><label class="field-label">Categoría</label>
            <select id="m-cat">${catOpts}</select></div>
        </div>
        <div class="modal-btns">
          <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
          <button class="btn-save" onclick="saveHabit(${habit?habit.id:0})">${habit?'Guardar':'Agregar'}</button>
        </div>
      </div>
    </div>`;
  setTimeout(()=>document.getElementById('m-name').focus(),50);
  document.getElementById('m-name').onkeydown=e=>{if(e.key==='Enter')saveHabit(habit?habit.id:0);};
}

function saveHabit(id){
  const name=document.getElementById('m-name').value.trim();
  const cat=document.getElementById('m-cat').value;
  const time=document.getElementById('m-time').value;
  if(!name)return;
  if(id){const h=S.habits.find(x=>x.id===id);if(h){h.name=name;h.cat=cat;h.time=time;}}
  else S.habits.push({id:S.nextHabitId++,name,cat,time});
  scheduleSave();closeModal();render();
  showToast(id?'Hábito actualizado':'Hábito agregado ✓');
}

function editHabit(id){openHabitModal(S.habits.find(x=>x.id===id));}
function deleteHabit(id){
  if(!confirm('¿Eliminar este hábito?'))return;
  S.habits=S.habits.filter(x=>x.id!==id);
  Object.keys(S.log).forEach(k=>{S.log[k]=S.log[k].filter(x=>x!==id);});
  scheduleSave();render();showToast('Hábito eliminado');
}

  const selDate=isoToDate(iso);
  const months=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const dateLabel=`${selDate.getDate()} ${months[selDate.getMonth()]} ${selDate.getFullYear()}`;

  document.getElementById('modal-container').innerHTML=`
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-handle"></div>
        <h3>${ev?'Editar evento':'Nuevo evento'} <span style="font-size:13px;color:var(--text3);font-weight:400">— ${dateLabel}</span></h3>
        <div class="field-group"><label class="field-label">Título</label>
          <input id="ev-title" placeholder="Ej: Reunión Godigital" value="${ev?ev.title:''}"/></div>
        <div class="row-2">
          <div class="field-group"><label class="field-label">Hora</label>
            <input id="ev-time" type="time" value="${ev&&ev.time?ev.time:prefillTime||''}"/></div>
          <div class="field-group"><label class="field-label">Recordatorio</label>
            <select id="ev-remind">
              <option value="0"${ev&&!ev.remind?' selected':''}>Sin recordatorio</option>
              <option value="1"${ev&&ev.remind?' selected':''}>15 min antes</option>
            </select></div>
        </div>
        <div class="field-group"><label class="field-label">Nota</label>
          <textarea id="ev-note" placeholder="Detalles opcionales...">${ev&&ev.note?ev.note:''}</textarea></div>
        <div class="field-group"><label class="field-label">Color</label>
          <div class="color-picker">${colPicker}</div></div>
        <div class="modal-btns">
          <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
          <button class="btn-save" onclick="saveEvent('${iso}',${ev?ev.id:0})">${ev?'Guardar':'Agregar'}</button>
        </div>
      </div>
    </div>`;
  setTimeout(()=>document.getElementById('ev-title').focus(),50);
  document.getElementById('ev-title').onkeydown=e=>{if(e.key==='Enter')saveEvent(iso,ev?ev.id:0);};
}

function selectColor(el){
  document.querySelectorAll('.color-opt').forEach(o=>o.classList.remove('selected'));
  el.classList.add('selected');
}

function saveEvent(iso, id){
  const title=document.getElementById('ev-title').value.trim();
  if(!title)return;
  const time=document.getElementById('ev-time').value;
  const remind=document.getElementById('ev-remind').value==='1';
  const note=document.getElementById('ev-note').value.trim();
  const colorEl=document.querySelector('.color-opt.selected');
  const color=colorEl?colorEl.dataset.cid:'blue';

  if(!S.events[iso]) S.events[iso]=[];
  if(id){
    const ev=S.events[iso].find(x=>x.id===id);
    if(ev){ev.title=title;ev.time=time;ev.remind=remind;ev.note=note;ev.color=color;}
  } else {
    S.events[iso].push({id:S.nextEventId++,title,time,remind,note,color});
  }
  scheduleSave();closeModal();render();scheduleNotifications();
  showToast(id?'Evento actualizado':'Evento agregado ✓');
  if(remind&&Notification.permission!=='granted') requestNotifPerms();
}

function deleteEvent(iso, id){
  if(!S.events[iso])return;
  S.events[iso]=S.events[iso].filter(x=>x.id!==id);
  if(!S.events[iso].length) delete S.events[iso];
  scheduleSave();render();showToast('Evento eliminado');
}

function closeModal(){document.getElementById('modal-container').innerHTML='';}

// ── TOAST ────────────────────────────────────────────────────
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

// ── INIT ─────────────────────────────────────────────────────
cacheLoad();
render();
syncFromSheet();
setInterval(syncFromSheet,60000);
requestNotifPerms();
</script>
</body>
</html>
