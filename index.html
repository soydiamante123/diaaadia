<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Día a Día</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F3EE;--surface:#FFF;--surface2:#EFEFEB;--surface3:#E8E6E0;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
  --text:#1A1A18;--text2:#6B6B64;--text3:#9E9E96;
  --green:#4A7C3F;--green-l:#EAF2E7;--green-m:#C5DFC0;
  --purple:#5B4FCF;--purple-l:#EEEDFE;
  --teal:#2A7A65;--teal-l:#E2F4EF;
  --amber:#A06B10;--amber-l:#FEF3E2;
  --coral:#B04030;--coral-l:#FCECEA;
  --blue:#1A6FA8;--blue-l:#E6F1FB;
  --radius:14px;--radius-sm:9px;--radius-xs:6px;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --nav-h:60px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#111110;--surface:#1C1B19;--surface2:#242320;--surface3:#2C2B28;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#F0EEE8;--text2:#9E9C94;--text3:#65645E;
  --green:#6BBF5E;--green-l:#162813;--green-m:#234020;
  --purple:#8B80EF;--purple-l:#1A1740;
  --teal:#4BBFA0;--teal-l:#0E2820;
  --amber:#D4960A;--amber-l:#231A06;
  --coral:#E07060;--coral-l:#251008;
  --blue:#4CA3D8;--blue-l:#0C2035;
}}
html{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}
body{max-width:540px;margin:0 auto;padding-bottom:calc(var(--nav-h)+20px)}

/* NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:540px;height:var(--nav-h);background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;z-index:50;padding:0 4px 4px}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;cursor:pointer;padding:6px 10px;border-radius:var(--radius-sm);color:var(--text3);font-size:9px;font-family:var(--mono);letter-spacing:.04em;transition:all .15s;flex:1}
.nav-btn.active{color:var(--green)}
.nav-btn svg{width:20px;height:20px;stroke-width:1.5;stroke:currentColor;fill:none}

/* HEADER */
.page-header{padding:20px 16px 12px;display:flex;align-items:center;justify-content:space-between}
.page-title{font-size:22px;font-weight:600;letter-spacing:-0.03em}
.page-title span{color:var(--green)}
.header-right{display:flex;align-items:center;gap:8px}
.today-chip{font-size:11px;font-family:var(--mono);color:var(--text2);background:var(--surface2);padding:5px 10px;border-radius:20px;border:1px solid var(--border)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);transition:background .3s;flex-shrink:0}
.sync-dot.ok{background:var(--green)}.sync-dot.err{background:#E24B4A}.sync-dot.loading{background:var(--amber);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.page{display:none}.page.active{display:block}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px;margin-bottom:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.stat-label{font-size:10px;color:var(--text3);margin-bottom:3px;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase}
.stat-val{font-size:21px;font-weight:600;letter-spacing:-0.02em}.stat-val.green{color:var(--green)}

/* PROGRESS */
.progress-wrap{padding:0 16px;margin-bottom:16px}
.progress-label{display:flex;justify-content:space-between;margin-bottom:5px}
.progress-label span{font-size:12px;color:var(--text2)}
.progress-track{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);border-radius:3px;transition:width .4s cubic-bezier(.4,0,.2,1)}

/* WELLBEING BAR */
.wellbeing-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px;margin-bottom:16px}
.wb-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:border-color .15s}
.wb-card:hover{border-color:var(--border2)}
.wb-label{font-size:10px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.wb-value{font-size:15px;font-weight:500;color:var(--text)}
.wb-empty{font-size:13px;color:var(--text3)}
.mood-emojis{display:flex;gap:4px;margin-top:4px}
.mood-opt{font-size:20px;cursor:pointer;opacity:.4;transition:all .15s;line-height:1}
.mood-opt.selected,.mood-opt:hover{opacity:1;transform:scale(1.2)}
.sleep-stars{display:flex;gap:3px;margin-top:4px}
.sleep-star{font-size:16px;cursor:pointer;opacity:.3;transition:all .15s}
.sleep-star.on,.sleep-star:hover{opacity:1}

/* SECTION */
.section{padding:0 16px;margin-bottom:18px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.section-head h2{font-size:12px;font-weight:500;color:var(--text2);font-family:var(--mono);text-transform:uppercase;letter-spacing:.07em}
.add-btn{display:flex;align-items:center;gap:3px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-xs);padding:5px 11px;font-size:11px;font-family:var(--font);font-weight:500;cursor:pointer;transition:opacity .15s}
.add-btn:hover{opacity:.85}.add-btn.blue{background:var(--blue)}.add-btn.amber{background:var(--amber)}

/* HABIT ROWS */
.habit-list{display:flex;flex-direction:column;gap:4px}
.habit-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);transition:all .15s;position:relative}
.habit-row.checked{border-color:transparent}
.habit-row.dragging{opacity:.4;border:2px dashed var(--green)}
.habit-row.drag-over{border-top:2px solid var(--green)}
.drag-handle{cursor:grab;color:var(--text3);font-size:14px;padding:0 2px;flex-shrink:0;touch-action:none}
.h-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;font-size:11px;color:#fff;background:none;padding:0;transition:all .2s}
.h-info{flex:1;min-width:0;cursor:pointer}
.h-name{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.habit-row.checked .h-name{text-decoration:line-through;color:var(--text3)}
.h-meta{display:flex;align-items:center;gap:5px;margin-top:2px;flex-wrap:wrap}
.h-time{font-size:10px;font-family:var(--mono);color:var(--text3)}
.h-dur{font-size:10px;font-family:var(--mono);color:var(--green)}
.h-cat{font-size:10px;font-family:var(--mono);padding:1px 6px;border-radius:20px}
.h-streak{font-size:10px;font-family:var(--mono);color:var(--amber)}
.timer-btn{background:none;border:1px solid var(--border2);border-radius:var(--radius-xs);padding:4px 8px;font-size:10px;font-family:var(--mono);cursor:pointer;color:var(--text2);white-space:nowrap;flex-shrink:0}
.timer-btn.running{background:var(--green);border-color:var(--green);color:#fff}
.timer-btn.done{background:var(--green-l);border-color:var(--green-m);color:var(--green)}
.h-edit{background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;padding:3px 4px;border-radius:4px;opacity:0;transition:opacity .15s}
.habit-row:hover .h-edit{opacity:1}

/* TASKS */
.task-list{display:flex;flex-direction:column;gap:4px}
.task-row{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);transition:all .15s}
.task-row.done-task{border-color:transparent;opacity:.6}
.task-check{width:20px;height:20px;border-radius:4px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;font-size:10px;color:#fff;background:none;padding:0;transition:all .2s}
.task-text{flex:1;font-size:13px;color:var(--text);cursor:pointer}
.task-row.done-task .task-text{text-decoration:line-through;color:var(--text3)}
.task-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:12px;padding:2px 4px;opacity:0;transition:opacity .15s}
.task-row:hover .task-del{opacity:1}

/* INGRESOS */
.income-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.income-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;cursor:pointer;transition:border-color .15s}
.income-card:hover{border-color:var(--border2)}
.income-label{font-size:10px;font-family:var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.income-val{font-size:16px;font-weight:600;color:var(--green)}
.income-empty{font-size:13px;color:var(--text3);font-weight:400}
.income-total{display:flex;align-items:center;justify-content:space-between;padding:8px 0 2px;border-top:1px solid var(--border);margin-top:8px}
.income-total-label{font-size:11px;font-family:var(--mono);color:var(--text3)}
.income-total-val{font-size:15px;font-weight:600;color:var(--green)}

/* EVENTS */
.event-chip{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:var(--radius-xs);margin-bottom:3px;cursor:pointer;position:relative}
.event-chip:hover .event-del{opacity:1}
.event-title-text{font-size:12px;font-weight:500;flex:1}
.event-time-tag{font-size:10px;font-family:var(--mono);opacity:.7}
.event-del{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:12px;opacity:0;padding:2px}

/* UPCOMING */
.upcoming-item{display:flex;gap:10px;padding:10px 13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);align-items:flex-start;margin-bottom:6px}
.upcoming-date-col{text-align:center;min-width:36px}
.upcoming-day{font-size:18px;font-weight:600;line-height:1}
.upcoming-month{font-size:9px;font-family:var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.upcoming-info{flex:1}
.upcoming-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:2px}
.upcoming-meta{font-size:11px;color:var(--text3);font-family:var(--mono)}
.upcoming-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;padding:2px;opacity:0}
.upcoming-item:hover .upcoming-del{opacity:1}

/* CALENDAR */
.cal-controls{padding:0 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav button{background:var(--surface2);border:1px solid var(--border);border-radius:6px;width:28px;height:28px;cursor:pointer;color:var(--text);font-size:15px;display:flex;align-items:center;justify-content:center}
.month-name{font-size:14px;font-weight:500;color:var(--text);min-width:130px;text-align:center}
.view-toggle{display:flex;background:var(--surface2);border-radius:var(--radius-xs);border:1px solid var(--border);overflow:hidden}
.view-btn{background:none;border:none;cursor:pointer;padding:5px 12px;font-size:11px;font-family:var(--mono);color:var(--text2);transition:all .15s}
.view-btn.active{background:var(--surface);color:var(--text);font-weight:500}
.month-view{padding:0 16px}
.weekdays-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
.weekday-label{text-align:center;font-size:10px;color:var(--text3);font-family:var(--mono)}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:12px}
.month-cell{aspect-ratio:1;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:all .15s;border:1px solid transparent}
.month-cell:hover{background:var(--surface2)}.month-cell.today{border-color:var(--green)}
.month-cell.selected{background:var(--green)}.month-cell.selected .cell-num{color:#fff;font-weight:600}
.month-cell.has-habits{background:var(--green-l)}.month-cell.has-habits.selected{background:var(--green)}
.month-cell.empty{opacity:0;pointer-events:none}
.cell-num{font-size:12px;font-family:var(--mono);color:var(--text2)}.month-cell.today .cell-num{color:var(--green);font-weight:600}
.cell-dots{display:flex;gap:2px;margin-top:2px}.cell-dot{width:4px;height:4px;border-radius:50%}
.day-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:16px}
.day-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.day-panel-title{font-size:14px;font-weight:500;color:var(--text)}
.day-panel-sub{font-size:11px;color:var(--text3);font-family:var(--mono);margin-top:1px}
.day-habits-list{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.day-habit-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-xs);cursor:pointer;border:1px solid var(--border);transition:all .15s}
.day-habit-row.checked{border-color:transparent}
.day-habit-check{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;flex-shrink:0}
.day-habit-name{font-size:12px;color:var(--text);flex:1}
.day-habit-row.checked .day-habit-name{text-decoration:line-through;color:var(--text3)}
.day-habit-time{font-size:10px;font-family:var(--mono);color:var(--text3)}
.day-view{padding:0 16px}
.day-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.day-nav-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;width:28px;height:28px;cursor:pointer;color:var(--text);font-size:15px;display:flex;align-items:center;justify-content:center}
.day-title{font-size:15px;font-weight:500;color:var(--text);flex:1;text-align:center}
.day-subtitle{font-size:11px;color:var(--text3);font-family:var(--mono)}
.timeline{position:relative}
.time-block{display:flex;gap:10px;min-height:40px;margin-bottom:1px}
.time-label{width:40px;font-size:10px;font-family:var(--mono);color:var(--text3);padding-top:12px;flex-shrink:0;text-align:right}
.time-events{flex:1;border-left:1px solid var(--border);padding-left:10px;padding-bottom:4px;min-height:40px;position:relative}
.time-events:hover .time-add-btn{opacity:1}
.time-add-btn{position:absolute;top:8px;right:4px;background:none;border:1px dashed var(--border2);border-radius:4px;padding:2px 6px;font-size:10px;color:var(--text3);cursor:pointer;opacity:0}

/* STATS PAGE */
.stats-page{padding:0 16px}
.stats-section-title{font-size:12px;font-weight:500;color:var(--text2);font-family:var(--mono);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;margin-top:16px}
.habit-stat-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:4px}
.habit-stat-name{font-size:13px;color:var(--text);flex:1}
.habit-stat-pct{font-size:13px;font-weight:600;font-family:var(--mono);color:var(--green);min-width:36px;text-align:right}
.habit-stat-streak{font-size:11px;font-family:var(--mono);color:var(--amber);min-width:40px;text-align:right}
.habit-stat-bar{height:3px;background:var(--green-l);border-radius:2px;margin-top:4px;overflow:hidden}
.habit-stat-fill{height:100%;background:var(--green);border-radius:2px}
.mood-chart{display:flex;align-items:flex-end;gap:3px;height:60px;margin-bottom:8px}
.mood-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.mood-bar{width:100%;border-radius:2px 2px 0 0;transition:height .3s;min-height:2px}
.mood-bar-label{font-size:8px;font-family:var(--mono);color:var(--text3)}
.income-chart{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.income-stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px}
.income-stat-label{font-size:10px;font-family:var(--mono);color:var(--text3);text-transform:uppercase;margin-bottom:3px}
.income-stat-val{font-size:15px;font-weight:600;color:var(--green)}
.income-stat-avg{font-size:10px;font-family:var(--mono);color:var(--text3);margin-top:2px}
.sleep-chart{display:flex;align-items:flex-end;gap:3px;height:50px;margin-bottom:8px}

/* FLOATING TIMER */
.float-timer{position:fixed;bottom:calc(var(--nav-h)+16px);right:16px;z-index:150;display:none;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none;width:200px}
.float-timer.visible{display:flex}
.float-bubble,.float-expand,.float-action-btn,.fexp-btn,.fexp-close{pointer-events:all}
.float-bubble{background:var(--green);color:#fff;border-radius:20px;padding:10px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 4px 20px rgba(74,124,63,0.35);width:100%}
.float-bubble-info{flex:1;min-width:0}
.float-bubble-name{font-size:10px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.float-bubble-time{font-size:19px;font-weight:600;font-family:var(--mono);letter-spacing:-0.02em;line-height:1.1}
.float-actions{display:flex;gap:4px;flex-shrink:0}
.float-action-btn{background:rgba(255,255,255,0.2);border:none;border-radius:8px;padding:5px 8px;font-size:11px;font-family:var(--mono);font-weight:500;color:#fff;cursor:pointer;transition:background .15s}
.float-action-btn:hover{background:rgba(255,255,255,0.35)}
.float-action-btn.ok{background:rgba(255,255,255,0.9);color:var(--green)}
.float-expand{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:16px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,0.12)}
.float-expand-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:2px}
.float-expand-cat{font-size:10px;font-family:var(--mono);color:var(--text3);margin-bottom:12px}
.float-expand-time{font-size:44px;font-weight:300;font-family:var(--mono);color:var(--green);text-align:center;margin-bottom:12px;letter-spacing:-0.02em}
.float-expand-btns{display:flex;gap:6px}
.fexp-btn{flex:1;border:none;border-radius:var(--radius-sm);padding:9px;font-size:12px;font-family:var(--font);font-weight:500;cursor:pointer}
.fexp-pause{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}
.fexp-complete{background:var(--green-l);color:var(--green);border:1px solid var(--green-m)}
.fexp-close{width:100%;margin-top:6px;background:none;border:none;color:var(--text3);font-size:11px;font-family:var(--font);cursor:pointer;padding:3px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(3px)}
.modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;padding:22px 20px 36px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto}
.modal-handle{width:36px;height:4px;background:var(--surface3);border-radius:2px;margin:0 auto 18px}
.modal h3{font-size:16px;font-weight:600;margin-bottom:18px}
.field-label{font-size:11px;font-family:var(--mono);color:var(--text2);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px}
.field-group{margin-bottom:14px}
.modal input,.modal select,.modal textarea{width:100%;padding:10px 12px;font-size:14px;font-family:var(--font);border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);outline:none;-webkit-appearance:none}
.modal input:focus,.modal select:focus{border-color:var(--green)}
.modal textarea{resize:vertical;min-height:64px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.btn-save{background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);padding:10px 22px;font-size:13px;font-family:var(--font);font-weight:500;cursor:pointer}
.btn-cancel{background:none;border:1px solid var(--border2);border-radius:var(--radius-sm);padding:10px 16px;font-size:13px;font-family:var(--font);cursor:pointer;color:var(--text2)}
.color-picker{display:flex;gap:8px;flex-wrap:wrap}

<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbzYryvBEa4Z1VIQ_DfBcGKEOSm13qTWdiqhWBg9Z8KMr5VqIUxg8u2eiYW8Vj4WqyKM/exec';

const CAT={
  salud:    {bg:'#EAF2E7',color:'#2A5426',check:'#4A7C3F',label:'Salud'},
  godigital:{bg:'#EEEDFE',color:'#26215C',check:'#5B4FCF',label:'Godigital'},
  amora:    {bg:'#E2F4EF',color:'#0D3228',check:'#2A7A65',label:'AmoraPets'},
  dinastia: {bg:'#FEF3E2',color:'#5A3A08',check:'#A06B10',label:'Dinastia'},
  crecim:   {bg:'#FCECEA',color:'#5A1A10',check:'#B04030',label:'Crecimiento'},
  libre:    {bg:'#F1EFE8',color:'#3A3A32',check:'#6B6B64',label:'Personal'},
};

const ECOLS=[
  {id:'blue',hex:'#1A6FA8',light:'#E6F1FB'},
  {id:'green',hex:'#4A7C3F',light:'#EAF2E7'},
  {id:'purple',hex:'#5B4FCF',light:'#EEEDFE'},
  {id:'coral',hex:'#B04030',light:'#FCECEA'},
  {id:'amber',hex:'#A06B10',light:'#FEF3E2'},
  {id:'teal',hex:'#2A7A65',light:'#E2F4EF'},
];

const MOODS=['😴','😕','😐','🙂','🤩'];
const MOOD_LABELS=['Muy mal','Mal','Regular','Bien','Excelente'];
const INCOME_SRC=['Godigital','AmoraPets','Dinastia'];

const DEFAULT_HABITS=[
  {id:1,name:'Gym',cat:'salud',time:'06:30',order:0},
  {id:2,name:'Suplementos',cat:'salud',time:'07:00',order:1},
  {id:3,name:'Desayuno saludable',cat:'salud',time:'08:00',order:2},
  {id:4,name:'Paseo perros (x3)',cat:'libre',time:'',order:3},
  {id:5,name:'Godigital — bloque estratégico',cat:'godigital',time:'09:00',order:4},
  {id:6,name:'Godigital — atención WhatsApp',cat:'godigital',time:'',order:5},
  {id:7,name:'AmoraPets — SEO / Google Ads',cat:'amora',time:'10:30',order:6},
  {id:8,name:'Dinastía cachorros — logística',cat:'dinastia',time:'13:30',order:7},
  {id:9,name:'Platzi — 1 hora',cat:'crecim',time:'17:30',order:8},
  {id:10,name:'Lectura',cat:'crecim',time:'20:00',order:9},
  {id:11,name:'Guitarra',cat:'libre',time:'21:00',order:10},
  {id:12,name:'Tiempo con la novia',cat:'libre',time:'20:30',order:11},
  {id:13,name:'Revisión del día + plan mañana',cat:'crecim',time:'21:30',order:12},
  {id:14,name:'Melatonina antes de dormir',cat:'salud',time:'22:00',order:13},
];

let S={
  habits:JSON.parse(JSON.stringify(DEFAULT_HABITS)),
  log:{},        // {iso:[habitId,...]}
  events:{},     // {iso:[{id,title,time,color,note,remind},...]}
  tasks:{},      // {iso:[{id,text,done},...]}
  income:{},     // {iso:{Godigital:0,AmoraPets:0,Dinastia:0}}
  wellbeing:{},  // {iso:{mood:0-4,sleepH:0,sleepQ:0-4}}
  timers:{},     // {habitId:{start,elapsed,running,date}}
  nextHabitId:15,nextEventId:1,nextTaskId:1,
  calYear:new Date().getFullYear(),calMonth:new Date().getMonth(),
  calView:'month',selectedDay:todayISO(),
};

let syncTimer=null,floatHabitId=null,floatExpanded=false,floatInterval=null,notifScheduled={};

// ── DATES ─────────────────────────────────────────────────────
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function selectedDayISO(){return S.selectedDay||todayISO();}
function isoToDate(iso){const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d);}
function dateToISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function formatDayLabel(iso){const d=isoToDate(iso);const days=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];const months=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;}
function fmtTime(sec){const m=Math.floor(sec/60),s=sec%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
function fmtMoney(n){return n>=1000000?`$${(n/1000000).toFixed(1)}M`:n>=1000?`$${Math.round(n/1000)}k`:`$${n}`;}

// ── STORAGE ──────────────────────────────────────────────────
function cacheLoad(){try{const s=localStorage.getItem('diadia_v4');if(s){const p=JSON.parse(s);Object.assign(S,p);S.calYear=new Date().getFullYear();S.calMonth=new Date().getMonth();}}catch(e){}}
function cacheSave(){try{localStorage.setItem('diadia_v4',JSON.stringify({habits:S.habits,log:S.log,events:S.events,tasks:S.tasks,income:S.income,wellbeing:S.wellbeing,timers:S.timers,nextHabitId:S.nextHabitId,nextEventId:S.nextEventId,nextTaskId:S.nextTaskId}));}catch(e){}}
function setSyncStatus(st){const d=document.getElementById('sync-dot');if(d)d.className='sync-dot '+st;}

async function syncFromSheet(){
  setSyncStatus('loading');
  try{
    const res=await fetch(SCRIPT_URL+'?v='+Date.now());
    const data=await res.json();
    const src=data.habits?data:(Object.values(data).pop()||{});
    if(src.habits){Object.assign(S,{habits:src.habits||S.habits,log:src.log||{},events:src.events||{},tasks:src.tasks||{},income:src.income||{},wellbeing:src.wellbeing||{},timers:src.timers||{},nextHabitId:src.nextHabitId||15,nextEventId:src.nextEventId||1,nextTaskId:src.nextTaskId||1});}
    cacheSave();setSyncStatus('ok');render();scheduleNotifications();
  }catch(e){setSyncStatus('err');}
}

function scheduleSave(){
  clearTimeout(syncTimer);cacheSave();
  syncTimer=setTimeout(async()=>{
    setSyncStatus('loading');
    try{
      await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'save',key:'main',habits:S.habits,log:S.log,events:S.events,tasks:S.tasks,income:S.income,wellbeing:S.wellbeing,timers:S.timers,nextHabitId:S.nextHabitId,nextEventId:S.nextEventId,nextTaskId:S.nextTaskId})});
      setSyncStatus('ok');
    }catch(e){setSyncStatus('err');}
  },1500);
}

// ── TIMER ────────────────────────────────────────────────────
function getTimerState(id){const t=S.timers[id];if(!t||t.date!==todayISO())return{running:false,elapsed:0};if(t.running){return{running:true,elapsed:t.elapsed+(Math.floor(Date.now()/1000)-t.start)};}return{running:false,elapsed:t.elapsed||0};}
function startTimer(id){S.timers[id]={running:true,start:Math.floor(Date.now()/1000),elapsed:getTimerState(id).elapsed,date:todayISO()};scheduleSave();}
function stopTimer(id){const st=getTimerState(id);S.timers[id]={running:false,elapsed:st.elapsed,date:todayISO()};scheduleSave();}
function completeWithTimer(id){stopTimer(id);const key=todayISO();if(!S.log[key])S.log[key]=[];if(!S.log[key].includes(id))S.log[key].push(id);scheduleSave();render();}

function openTimerModal(id){
  const h=S.habits.find(x=>x.id===id);if(!h)return;
  floatHabitId=id;startTimer(id);showFloatTimer();
  showToast('Contador iniciado — navega libremente');
}

function showFloatTimer(){
  const ft=document.getElementById('float-timer');if(!ft)return;
  ft.classList.add('visible');updateFloatTimer();
  clearInterval(floatInterval);
  floatInterval=setInterval(updateFloatTimer,1000);
}

function updateFloatTimer(){
  if(!floatHabitId)return;
  const h=S.habits.find(x=>x.id===floatHabitId);if(!h){hideFloatTimer();return;}
  const st=getTimerState(floatHabitId);
  const cat=CAT[h.cat]||CAT.libre;
  const isC=(S.log[todayISO()]||[]).includes(floatHabitId);
  const n=document.getElementById('fbub-name');const t=document.getElementById('fbub-time');const p=document.getElementById('fbub-pause');const b=document.getElementById('float-bubble');
  if(n)n.textContent=h.name;if(t)t.textContent=fmtTime(st.elapsed);if(p)p.textContent=st.running?'II':'>';if(b)b.style.opacity=st.running?'1':'0.75';
  if(floatExpanded){const en=document.getElementById('fexp-name');const et=document.getElementById('fexp-time');const ep=document.getElementById('fexp-pause-btn');const ec=document.getElementById('fexp-cat');if(en)en.textContent=h.name;if(ec)ec.textContent=cat.label;if(et)et.textContent=fmtTime(st.elapsed);if(ep)ep.textContent=st.running?'Pausar':'Continuar';}
  if(isC){clearInterval(floatInterval);setTimeout(hideFloatTimer,2000);}
}

function floatExpand(){floatExpanded=true;const e=document.getElementById('float-expand');const b=document.getElementById('float-bubble');if(e)e.style.display='block';if(b)b.style.display='none';updateFloatTimer();}
function floatCollapse(){floatExpanded=false;const e=document.getElementById('float-expand');const b=document.getElementById('float-bubble');if(e)e.style.display='none';if(b)b.style.display='flex';}
function floatPause(){if(!floatHabitId)return;const st=getTimerState(floatHabitId);if(st.running)stopTimer(floatHabitId);else startTimer(floatHabitId);updateFloatTimer();}
function floatComplete(){if(!floatHabitId)return;completeWithTimer(floatHabitId);showToast('✓ Completado');setTimeout(hideFloatTimer,1500);}
function hideFloatTimer(){clearInterval(floatInterval);floatHabitId=null;floatExpanded=false;const ft=document.getElementById('float-timer');if(ft)ft.classList.remove('visible');const e=document.getElementById('float-expand');const b=document.getElementById('float-bubble');if(e)e.style.display='none';if(b)b.style.display='flex';}

// ── HABITS ───────────────────────────────────────────────────
function toggleHabit(id,iso){
  const key=iso||todayISO();if(!S.log[key])S.log[key]=[];
  const idx=S.log[key].indexOf(id);
  if(idx===-1){S.log[key].push(id);showToast('✓ Completado');}else{S.log[key].splice(idx,1);showToast('Desmarcado');}
  scheduleSave();render();
}
function getChecked(iso){return S.log[iso||todayISO()]||[];}
function getOrderedHabits(){return[...S.habits].sort((a,b)=>(a.order??99)-(b.order??99));}
function getStreak(){let s=0,t=new Date();for(let i=0;i<365;i++){const d=new Date(t);d.setDate(d.getDate()-i);if((S.log[dateToISO(d)]||[]).length>0)s++;else if(i>0)break;}return s;}
function getMonthPct(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),days=new Date(y,m+1,0).getDate();let total=0,count=0;for(let d=1;d<=days;d++){if(d>n.getDate())break;const iso=dateToISO(new Date(y,m,d));const done=(S.log[iso]||[]).length;if(done>0||(d===n.getDate())){total+=done/Math.max(S.habits.length,1);count++;}}return count>0?Math.round((total/count)*100):0;}
function getHabitStreak(habitId){let s=0,t=new Date();for(let i=0;i<365;i++){const d=new Date(t);d.setDate(d.getDate()-i);if((S.log[dateToISO(d)]||[]).includes(habitId))s++;else if(i>0)break;}return s;}
function getHabitPct(habitId){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),days=new Date(y,m+1,0).getDate();let done=0,count=0;for(let d=1;d<=days;d++){if(d>n.getDate())break;const iso=dateToISO(new Date(y,m,d));count++;if((S.log[iso]||[]).includes(habitId))done++;}return count>0?Math.round((done/count)*100):0;}

// ── RENDER: TODAY ────────────────────────────────────────────
function renderToday(){
  const iso=todayISO();
  const checked=getChecked(iso);
  const total=S.habits.length;
  const pct=total>0?Math.round((checked.length/total)*100):0;
  document.getElementById('stat-today').textContent=pct+'%';
  document.getElementById('stat-streak').textContent=getStreak()+'d';
  document.getElementById('stat-month').textContent=getMonthPct()+'%';
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('progress-text').textContent=`${checked.length} de ${total} hábitos`;
  document.getElementById('progress-pct').textContent=pct+'%';
  const days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const months=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const now=new Date();
  document.getElementById('today-chip').textContent=`${days[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]}`;

  // Wellbeing
  const wb=S.wellbeing[iso]||{};
  const sleepEl=document.getElementById('wb-sleep-val');
  const moodEl=document.getElementById('wb-mood-val');
  if(wb.sleepH){sleepEl.innerHTML=`<strong>${wb.sleepH}h</strong> <span style="color:var(--text3);font-size:12px">${'⭐'.repeat(wb.sleepQ+1)}</span>`;}
  else{sleepEl.className='wb-empty';sleepEl.textContent='Toca para registrar';}
  if(wb.mood!==undefined){moodEl.innerHTML=`<span style="font-size:20px">${MOODS[wb.mood]}</span> <span style="font-size:12px;color:var(--text3)">${MOOD_LABELS[wb.mood]}</span>`;}
  else{moodEl.className='wb-empty';moodEl.textContent='¿Cómo estás?';}

  // Habits
  const ordered=getOrderedHabits();
  const pending=ordered.filter(h=>!checked.includes(h.id));
  const done=ordered.filter(h=>checked.includes(h.id));
  const hl=document.getElementById('today-habit-list');
  hl.innerHTML='';
  if(!ordered.length){hl.innerHTML='<div class="empty-state">No hay hábitos.</div>';return;}
  [...pending,...done].forEach(h=>{
    const isC=checked.includes(h.id);
    const cat=CAT[h.cat]||CAT.libre;
    const st=getTimerState(h.id);
    const streak=getHabitStreak(h.id);
    const row=document.createElement('div');
    row.className='habit-row'+(isC?' checked':'');
    if(isC){row.style.background=cat.bg;row.style.borderColor='transparent';}

    const checkBtn=document.createElement('button');
    checkBtn.className='h-check';
    checkBtn.style.cssText=`border-color:${isC?cat.check:'var(--border2)'};background:${isC?cat.check:'none'}`;
    checkBtn.textContent=isC?'✓':'';
    checkBtn.addEventListener('click',e=>{e.stopPropagation();toggleHabit(h.id,iso);});

    const info=document.createElement('div');
    info.className='h-info';
    info.innerHTML=`<div class="h-name">${h.name}</div><div class="h-meta">${h.time?`<span class="h-time">${h.time}</span>`:''}<span class="h-cat" style="background:${cat.bg};color:${cat.color}">${cat.label}</span>${streak>1?`<span class="h-streak">🔥${streak}d</span>`:''}${st.elapsed>0?`<span class="h-dur">${fmtTime(st.elapsed)}</span>`:''}</div>`;
    info.addEventListener('click',()=>toggleHabit(h.id,iso));

    const timerBtn=document.createElement('button');
    if(isC){timerBtn.className='timer-btn done';timerBtn.textContent=st.elapsed>0?fmtTime(st.elapsed):'✓';}
    else if(st.running){timerBtn.className='timer-btn running';timerBtn.dataset.hid=h.id;timerBtn.textContent=fmtTime(st.elapsed);timerBtn.addEventListener('click',e=>{e.stopPropagation();floatExpand();});}
    else{timerBtn.className='timer-btn';timerBtn.textContent='⏱';timerBtn.addEventListener('click',e=>{e.stopPropagation();openTimerModal(h.id);});}

    const editBtn=document.createElement('button');
    editBtn.className='h-edit';editBtn.innerHTML='✏️';
    editBtn.addEventListener('click',e=>{e.stopPropagation();editHabit(h.id);});

    row.appendChild(checkBtn);row.appendChild(info);row.appendChild(timerBtn);row.appendChild(editBtn);
    hl.appendChild(row);
  });

  if(Object.values(S.timers).some(t=>t.running&&t.date===todayISO())){}

  // Tasks
  const tasks=S.tasks[iso]||[];
  const tl=document.getElementById('task-list');
  tl.innerHTML='';
  if(!tasks.length)tl.innerHTML='<div class="empty-state">Sin tareas hoy. ¡Agrega una!</div>';
  else tasks.forEach(task=>{
    const row=document.createElement('div');
    row.className='task-row'+(task.done?' done-task':'');
    const cb=document.createElement('button');
    cb.className='task-check';
    cb.style.cssText=`border-color:${task.done?'var(--green)':'var(--border2)'};background:${task.done?'var(--green)':'none'}`;
    cb.textContent=task.done?'✓':'';
    cb.addEventListener('click',e=>{e.stopPropagation();toggleTask(iso,task.id);});
    const txt=document.createElement('span');txt.className='task-text';txt.textContent=task.text;
    txt.addEventListener('click',()=>toggleTask(iso,task.id));
    const del=document.createElement('button');del.className='task-del';del.textContent='✕';
    del.addEventListener('click',e=>{e.stopPropagation();deleteTask(iso,task.id);});
    row.appendChild(cb);row.appendChild(txt);row.appendChild(del);
    tl.appendChild(row);
  });

  // Income
  renderIncome(iso);

  // Events today
  const evts=(S.events[iso]||[]).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const el=document.getElementById('today-events-list');
  el.innerHTML='';
  if(!evts.length)el.innerHTML='<div class="empty-state">Sin eventos hoy.</div>';
  else evts.forEach(ev=>el.appendChild(makeEventChip(ev,iso)));

  // Upcoming
  const ul=document.getElementById('upcoming-list');ul.innerHTML='';
  const upcoming=[];
  for(let i=1;i<=30;i++){const d=new Date();d.setDate(d.getDate()+i);const diso=dateToISO(d);(S.events[diso]||[]).forEach(ev=>upcoming.push({ev,iso:diso,d}));}
  upcoming.sort((a,b)=>a.iso!==b.iso?a.iso.localeCompare(b.iso):(a.ev.time||'').localeCompare(b.ev.time||''));
  const mS=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  if(!upcoming.length)ul.innerHTML='<div class="empty-state">No hay eventos próximos.</div>';
  else upcoming.slice(0,6).forEach(({ev,iso:ui,d})=>{
    const col=ECOLS.find(c=>c.id===ev.color)||ECOLS[0];
    const item=document.createElement('div');item.className='upcoming-item';
    item.innerHTML=`<div class="upcoming-date-col"><div class="upcoming-day" style="color:${col.hex}">${d.getDate()}</div><div class="upcoming-month">${mS[d.getMonth()]}</div></div><div class="upcoming-info"><div class="upcoming-title">${ev.title}</div><div class="upcoming-meta">${ev.time||'Sin hora'}${ev.note?' · '+ev.note:''}</div></div><button class="upcoming-del" onclick="deleteEvent('${ui}',${ev.id})">✕</button>`;
    ul.appendChild(item);
  });
}

function renderIncome(iso){
  const inc=S.income[iso]||{};
  const grid=document.getElementById('income-grid');
  const totalEl=document.getElementById('income-total');
  const totalVal=document.getElementById('income-total-val');
  if(!grid)return;
  grid.innerHTML='';
  let total=0;
  INCOME_SRC.forEach(src=>{
    const val=inc[src]||0;total+=val;
    const card=document.createElement('div');card.className='income-card';
    card.innerHTML=`<div class="income-label">${src}</div>${val>0?`<div class="income-val">${fmtMoney(val)}</div>`:`<div class="income-empty">—</div>`}`;
    card.addEventListener('click',()=>openIncomeModal(iso,src));
    grid.appendChild(card);
  });
  if(total>0){totalEl.style.display='flex';totalVal.textContent=fmtMoney(total);}
  else{totalEl.style.display='none';}
}

// ── TASKS ────────────────────────────────────────────────────
function toggleTask(iso,id){
  const tasks=S.tasks[iso]||[];
  const t=tasks.find(x=>x.id===id);
  if(t){t.done=!t.done;scheduleSave();renderToday();}
}
function deleteTask(iso,id){
  if(!S.tasks[iso])return;
  S.tasks[iso]=S.tasks[iso].filter(x=>x.id!==id);
  scheduleSave();renderToday();
}
function openTaskModal(){
  document.getElementById('modal-container').innerHTML=`
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-handle"></div>
        <h3>Nueva tarea</h3>
        <div class="field-group"><label class="field-label">Tarea</label><input id="task-input" placeholder="Ej: Llamar a proveedor"/></div>
        <div class="modal-btns"><button class="btn-cancel" onclick="closeModal()">Cancelar</button><button class="btn-save" onclick="saveTask()">Agregar</button></div>
      </div>
    </div>`;
  setTimeout(()=>document.getElementById('task-input').focus(),50);
  document.getElementById('task-input').onkeydown=e=>{if(e.key==='Enter')saveTask();};
}
function saveTask(){
  const text=document.getElementById('task-input').value.trim();if(!text)return;
  const iso=todayISO();if(!S.tasks[iso])S.tasks[iso]=[];
  S.tasks[iso].push({id:S.nextTaskId++,text,done:false});
  scheduleSave();closeModal();renderToday();showToast('Tarea agregada');
}

// ── INCOME ───────────────────────────────────────────────────

  iso=iso||todayISO();
  const srcOpts=INCOME_SRC.map(s=>`<option value="${s}"${s===src?' selected':''}>${s}</option>`).join('');
  const current=(S.income[iso]&&S.income[iso][src])||0;
  document.getElementById('modal-container').innerHTML=`
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-handle"></div>

function saveIncome(iso){
  const src=document.getElementById('inc-src').value;

// ── RENDER: CALENDAR ─────────────────────────────────────────
function makeEventChip(ev,iso){
  const col=ECOLS.find(c=>c.id===ev.color)||ECOLS[0];
  const chip=document.createElement('div');chip.className='event-chip';
  chip.style.cssText=`background:${col.light};color:${col.hex};margin-bottom:4px`;
  chip.innerHTML=`<span style="width:6px;height:6px;border-radius:50%;background:${col.hex};display:inline-block;flex-shrink:0"></span><span class="event-title-text" style="color:${col.hex}">${ev.title}</span>${ev.time?`<span class="event-time-tag">${ev.time}</span>`:''}${ev.remind?'<span style="font-size:10px">🔔</span>':''}<button class="event-del" onclick="event.stopPropagation();deleteEvent('${iso}',${ev.id})">✕</button>`;
  chip.onclick=()=>openEventModal(iso,ev);return chip;
}

function renderCalendar(){
  const months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  document.getElementById('cal-month-name').textContent=`${months[S.calMonth]} ${S.calYear}`;
  if(S.calView==='month'){renderMonthGrid();renderDayPanel();}else{renderDayView();}
}

function renderMonthGrid(){
  const y=S.calYear,m=S.calMonth,today=new Date();
  const firstDay=new Date(y,m,1).getDay(),daysInMonth=new Date(y,m+1,0).getDate();
  const grid=document.getElementById('month-grid');grid.innerHTML='';
  for(let i=0;i<firstDay;i++){const el=document.createElement('div');el.className='month-cell empty';grid.appendChild(el);}
  for(let d=1;d<=daysInMonth;d++){
    const iso=dateToISO(new Date(y,m,d));
    const evts=S.events[iso]||[];
    const habDone=(S.log[iso]||[]).length>0;
    const isToday=today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d;
    const isSel=iso===S.selectedDay;
    const cell=document.createElement('div');
    cell.className='month-cell'+(isToday?' today':'')+(isSel?' selected':habDone?' has-habits':'');
    const dots=evts.length?`<div class="cell-dots">${evts.slice(0,3).map(ev=>{const col=ECOLS.find(c=>c.id===ev.color)||ECOLS[0];return`<div class="cell-dot" style="background:${isSel?'rgba(255,255,255,0.8)':col.hex}"></div>`;}).join('')}</div>`:'';
    cell.innerHTML=`<span class="cell-num">${d}</span>${dots}`;
    cell.onclick=()=>{S.selectedDay=iso;renderCalendar();};
    grid.appendChild(cell);
  }
}

function renderDayPanel(){
  const iso=S.selectedDay;const panel=document.getElementById('month-day-panel');panel.innerHTML='';if(!iso)return;
  const evts=(S.events[iso]||[]).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const checked=getChecked(iso);const ordered=getOrderedHabits();
  const wrap=document.createElement('div');wrap.className='day-panel';
  const pct=S.habits.length?Math.round((checked.length/S.habits.length)*100):0;
  const hd=document.createElement('div');hd.className='day-panel-header';
  hd.innerHTML=`<div><div class="day-panel-title">${formatDayLabel(iso)}</div><div class="day-panel-sub">${checked.length}/${S.habits.length} hábitos · ${pct}%</div></div><button class="add-btn blue" onclick="openEventModal('${iso}')" style="font-size:11px">+ Evento</button>`;
  wrap.appendChild(hd);
  const pending=ordered.filter(h=>!checked.includes(h.id));

  [...pending,...done].forEach(h=>{
    const isC=checked.includes(h.id);const cat=CAT[h.cat]||CAT.libre;

    if(isC)row.style.cssText=`background:${cat.bg};border-color:transparent`;

    row.onclick=()=>{toggleHabit(h.id,iso);renderCalendar();};

  wrap.appendChild(habList);
  if(evts.length){const ed=document.createElement('div');ed.style.cssText='margin-top:10px;border-top:1px solid var(--border);padding-top:10px';evts.forEach(ev=>ed.appendChild(makeEventChip(ev,iso)));wrap.appendChild(ed);}
  panel.appendChild(wrap);
}

function renderDayView(){

    row.onclick=()=>{toggleHabit(h.id,iso);renderCalendar();};hl2.appendChild(row);
  });

// ── RENDER: ALL HABITS (drag) ────────────────────────────────
function renderAllHabits(){
  const list=document.getElementById('all-habit-list');list.innerHTML='';
  const ordered=getOrderedHabits();
  if(!ordered.length){list.innerHTML='<div class="empty-state">No hay hábitos.</div>';return;}
  ordered.forEach(h=>{
    const cat=CAT[h.cat]||CAT.libre;
    const streak=getHabitStreak(h.id);const pct=getHabitPct(h.id);
    const row=document.createElement('div');row.className='habit-row';row.draggable=true;row.dataset.id=h.id;
    row.innerHTML=`<div class="drag-handle">⠿</div><div class="h-check" style="border-color:${cat.check};cursor:default"></div><div class="h-info" style="cursor:default"><div class="h-name">${h.name}</div><div class="h-meta">${h.time?`<span class="h-time">${h.time}</span>`:''}<span class="h-cat" style="background:${cat.bg};color:${cat.color}">${cat.label}</span>${streak>0?`<span class="h-streak">🔥${streak}d</span>`:''}<span style="font-size:10px;font-family:var(--mono);color:var(--text3)">${pct}% este mes</span></div></div><div style="display:flex;gap:4px"><button class="h-edit" style="opacity:1" onclick="editHabit(${h.id})">✏️</button><button class="h-edit" style="opacity:1" onclick="deleteHabit(${h.id})">🗑</button></div>`;
    row.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',h.id);row.classList.add('dragging');});
    row.addEventListener('dragend',()=>{row.classList.remove('dragging');document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));});
    row.addEventListener('dragover',e=>{e.preventDefault();row.classList.add('drag-over');});
    row.addEventListener('dragleave',()=>row.classList.remove('drag-over'));
    row.addEventListener('drop',e=>{
      e.preventDefault();row.classList.remove('drag-over');
      const fromId=parseInt(e.dataTransfer.getData('text/plain'));const toId=h.id;if(fromId===toId)return;
      const fi=S.habits.findIndex(x=>x.id===fromId);const ti=S.habits.findIndex(x=>x.id===toId);
      const[m]=S.habits.splice(fi,1);S.habits.splice(ti,0,m);S.habits.forEach((h2,i)=>h2.order=i);
      scheduleSave();renderAllHabits();
    });
    // Touch
    row.addEventListener('touchstart',e=>{row.classList.add('dragging');},{passive:true});
    row.addEventListener('touchmove',e=>{e.preventDefault();const y=e.touches[0].clientY;const x=e.touches[0].clientX;const els=document.elementsFromPoint(x,y);const target=els.find(el=>el.classList.contains('habit-row')&&el!==row);document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));if(target)target.classList.add('drag-over');},{passive:false});
    row.addEventListener('touchend',e=>{row.classList.remove('dragging');const y=e.changedTouches[0].clientY;const x=e.changedTouches[0].clientX;const els=document.elementsFromPoint(x,y);const target=els.find(el=>el.classList.contains('habit-row')&&el!==row);document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));if(target){const fromId=h.id;const toId=parseInt(target.dataset.id);if(fromId!==toId){const fi=S.habits.findIndex(x=>x.id===fromId);const ti=S.habits.findIndex(x=>x.id===toId);const[m]=S.habits.splice(fi,1);S.habits.splice(ti,0,m);S.habits.forEach((h2,i)=>h2.order=i);scheduleSave();renderAllHabits();}}});
    list.appendChild(row);
  });
}

// ── RENDER: STATS ────────────────────────────────────────────
function renderStats(){
  const container=document.getElementById('stats-content');container.innerHTML='';
  const now=new Date();const y=now.getFullYear();const m=now.getMonth();
  const months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  // Title
  const title=document.createElement('div');title.style.cssText='font-size:13px;color:var(--text2);margin-bottom:16px;font-family:var(--mono)';title.textContent=months[m]+' '+y;container.appendChild(title);

  // Habit stats
  const h2=document.createElement('div');h2.className='stats-section-title';h2.textContent='Hábitos este mes';container.appendChild(h2);
  const ordered=getOrderedHabits();
  ordered.forEach(h=>{
    const pct=getHabitPct(h.id);const streak=getHabitStreak(h.id);const cat=CAT[h.cat]||CAT.libre;
    const row=document.createElement('div');row.className='habit-stat-row';
    row.innerHTML=`<div style="width:8px;height:8px;border-radius:50%;background:${cat.check};flex-shrink:0"></div><div style="flex:1"><div class="habit-stat-name">${h.name}</div><div class="habit-stat-bar"><div class="habit-stat-fill" style="width:${pct}%"></div></div></div><div class="habit-stat-streak">${streak>0?'🔥'+streak+'d':''}</div><div class="habit-stat-pct">${pct}%</div>`;
    container.appendChild(row);
  });

  // Mood chart
  const h3=document.createElement('div');h3.className='stats-section-title';h3.style.marginTop='20px';h3.textContent='Estado de ánimo — últimos 14 días';container.appendChild(h3);
  const moodChart=document.createElement('div');moodChart.className='mood-chart';
  for(let i=13;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);const iso=dateToISO(d);
    const wb=S.wellbeing[iso]||{};const mood=wb.mood;
    const wrap=document.createElement('div');wrap.className='mood-bar-wrap';
    const bar=document.createElement('div');bar.className='mood-bar';
    if(mood!==undefined){const h_pct=((mood+1)/5)*100;bar.style.cssText=`height:${h_pct}%;background:${['#E24B4A','#E07060','#D4960A','#4A7C3F','#2A7A65'][mood]};width:100%`;}
    else{bar.style.cssText='height:2px;background:var(--border2);width:100%';}
    const lbl=document.createElement('div');lbl.className='mood-bar-label';lbl.textContent=d.getDate();
    wrap.appendChild(bar);wrap.appendChild(lbl);moodChart.appendChild(wrap);
  }
  container.appendChild(moodChart);
  const moodLegend=document.createElement('div');moodLegend.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px';
  MOODS.forEach((m,i)=>{const s=document.createElement('span');s.style.cssText='font-size:11px;color:var(--text3);font-family:var(--mono)';s.textContent=`${m} ${MOOD_LABELS[i]}`;moodLegend.appendChild(s);});
  container.appendChild(moodLegend);

  // Sleep chart
  const h4=document.createElement('div');h4.className='stats-section-title';h4.style.marginTop='20px';h4.textContent='Sueño — últimos 14 días';container.appendChild(h4);
  const sleepChart=document.createElement('div');sleepChart.style.cssText='display:flex;align-items:flex-end;gap:3px;height:60px;margin-bottom:8px';
  for(let i=13;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);const iso=dateToISO(d);
    const wb=S.wellbeing[iso]||{};
    const wrap=document.createElement('div');wrap.style.cssText='flex:1;display:flex;flex-direction:column;align-items:center;gap:2px';
    const bar=document.createElement('div');
    if(wb.sleepH){const pct=((wb.sleepH-3)/9)*100;const q=wb.sleepQ||2;const colors=['#E24B4A','#E07060','#D4960A','#4A7C3F','#2A7A65'];bar.style.cssText=`height:${Math.max(pct,5)}%;background:${colors[q]};width:100%;border-radius:2px 2px 0 0`;}
    else{bar.style.cssText='height:2px;background:var(--border2);width:100%';}
    const lbl=document.createElement('div');lbl.style.cssText='font-size:8px;font-family:var(--mono);color:var(--text3)';lbl.textContent=d.getDate();
    lbl.title=wb.sleepH?`${wb.sleepH}h`:'';
    wrap.appendChild(bar);wrap.appendChild(lbl);sleepChart.appendChild(wrap);
  }
  container.appendChild(sleepChart);

  // Income stats
  const h5=document.createElement('div');h5.className='stats-section-title';h5.style.marginTop='20px';h5.textContent='Ingresos este mes';container.appendChild(h5);
  const incChart=document.createElement('div');incChart.className='income-chart';
  const days=new Date(y,m+1,0).getDate();
  INCOME_SRC.forEach(src=>{
    let total=0,count=0;
    for(let d=1;d<=days;d++){const iso=dateToISO(new Date(y,m,d));if(S.income[iso]&&S.income[iso][src]){total+=S.income[iso][src];count++;}}
    const avg=count>0?Math.round(total/count):0;
    const card=document.createElement('div');card.className='income-stat-card';
    card.innerHTML=`<div class="income-stat-label">${src}</div><div class="income-stat-val">${total>0?fmtMoney(total):'—'}</div><div class="income-stat-avg">${count>0?`Prom: ${fmtMoney(avg)}/día`:''}</div>`;
    incChart.appendChild(card);
  });
  container.appendChild(incChart);
  const allIncome=Object.values(S.income).reduce((tot,day)=>tot+INCOME_SRC.reduce((s,src)=>s+(day[src]||0),0),0);
  if(allIncome>0){const totalRow=document.createElement('div');totalRow.style.cssText='display:flex;justify-content:space-between;padding:10px 12px;background:var(--green-l);border-radius:var(--radius-sm);margin-top:4px';totalRow.innerHTML=`<span style="font-size:13px;color:var(--text2);font-family:var(--mono)">Total histórico</span><span style="font-size:15px;font-weight:600;color:var(--green)">${fmtMoney(allIncome)}</span>`;container.appendChild(totalRow);}
}

// ── MASTER RENDER ────────────────────────────────────────────
function render(){renderToday();renderCalendar();renderAllHabits();}

// ── PAGE NAV ─────────────────────────────────────────────────
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  document.getElementById('nav-'+id).classList.add('active');
  if(id==='cal')renderCalendar();
  if(id==='stats')renderStats();
}
function changeCalMonth(dir){S.calMonth+=dir;if(S.calMonth<0){S.calMonth=11;S.calYear--;}if(S.calMonth>11){S.calMonth=0;S.calYear++;}renderCalendar();}
function setCalView(v){S.calView=v;document.getElementById('vbtn-month').classList.toggle('active',v==='month');document.getElementById('vbtn-day').classList.toggle('active',v==='day');document.getElementById('month-view-wrap').style.display=v==='month'?'block':'none';document.getElementById('day-view-wrap').style.display=v==='day'?'block':'none';renderCalendar();}
function changeSelectedDay(dir){const d=isoToDate(S.selectedDay);d.setDate(d.getDate()+dir);S.selectedDay=dateToISO(d);S.calYear=d.getFullYear();S.calMonth=d.getMonth();renderCalendar();}

// ── MODALS: HABIT & EVENT ────────────────────────────────────
function openHabitModal(habit){
  const catOpts=Object.entries(CAT).map(([k,v])=>`<option value="${k}"${habit&&habit.cat===k?' selected':''}>${v.label}</option>`).join('');
  document.getElementById('modal-container').innerHTML=`
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal"><div class="modal-handle"></div>
        <h3>${habit?'Editar hábito':'Nuevo hábito'}</h3>
        <div class="field-group"><label class="field-label">Nombre</label><input id="m-name" placeholder="Ej: Meditar 10 min" value="${habit?habit.name:''}"/></div>
        <div class="row-2">
          <div class="field-group"><label class="field-label">Hora</label><input id="m-time" type="time" value="${habit&&habit.time?habit.time:''}"/></div>
          <div class="field-group"><label class="field-label">Categoría</label><select id="m-cat">${catOpts}</select></div>
        </div>
        <div class="modal-btns"><button class="btn-cancel" onclick="closeModal()">Cancelar</button><button class="btn-save" onclick="saveHabit(${habit?habit.id:0})">${habit?'Guardar':'Agregar'}</button></div>
      </div>
    </div>`;
  setTimeout(()=>document.getElementById('m-name').focus(),50);
  document.getElementById('m-name').onkeydown=e=>{if(e.key==='Enter')saveHabit(habit?habit.id:0);};
}
function saveHabit(id){
  const name=document.getElementById('m-name').value.trim();const cat=document.getElementById('m-cat').value;const time=document.getElementById('m-time').value;
  if(!name)return;
  if(id){const h=S.habits.find(x=>x.id===id);if(h){h.name=name;h.cat=cat;h.time=time;}}
  else S.habits.push({id:S.nextHabitId++,name,cat,time,order:S.habits.length});
  scheduleSave();closeModal();render();showToast(id?'Hábito actualizado':'Hábito agregado ✓');
}
function editHabit(id){openHabitModal(S.habits.find(x=>x.id===id));}
function deleteHabit(id){if(!confirm('¿Eliminar?'))return;S.habits=S.habits.filter(x=>x.id!==id);Object.keys(S.log).forEach(k=>{S.log[k]=S.log[k].filter(x=>x!==id);});scheduleSave();render();showToast('Eliminado');}

function openEventModal(iso,ev,prefillTime){
  const colPicker=ECOLS.map(c=>`<div class="color-opt${ev&&ev.color===c.id?' selected':(!ev&&c.id==='blue'?' selected':'')}" style="background:${c.hex}" data-cid="${c.id}" onclick="selectColor(this)"></div>`).join('');
  const d=isoToDate(iso);const mS=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  document.getElementById('modal-container').innerHTML=`
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal"><div class="modal-handle"></div>
        <h3>${ev?'Editar evento':'Nuevo evento'} <span style="font-size:13px;color:var(--text3);font-weight:400">— ${d.getDate()} ${mS[d.getMonth()]}</span></h3>
        <div class="field-group"><label class="field-label">Título</label><input id="ev-title" placeholder="Ej: Reunión Godigital" value="${ev?ev.title:''}"/></div>
        <div class="row-2">
          <div class="field-group"><label class="field-label">Hora</label><input id="ev-time" type="time" value="${ev&&ev.time?ev.time:prefillTime||''}"/></div>
          <div class="field-group"><label class="field-label">Recordatorio</label><select id="ev-remind"><option value="0"${ev&&!ev.remind?' selected':''}>Sin recordatorio</option><option value="1"${ev&&ev.remind?' selected':''}>15 min antes</option></select></div>
        </div>
        <div class="field-group"><label class="field-label">Nota</label><textarea id="ev-note" placeholder="Detalles...">${ev&&ev.note?ev.note:''}</textarea></div>
        <div class="field-group"><label class="field-label">Color</label><div class="color-picker">${colPicker}</div></div>
        <div class="modal-btns"><button class="btn-cancel" onclick="closeModal()">Cancelar</button><button class="btn-save" onclick="saveEvent('${iso}',${ev?ev.id:0})">${ev?'Guardar':'Agregar'}</button></div>
      </div>
    </div>`;
  setTimeout(()=>document.getElementById('ev-title').focus(),50);
}
function selectColor(el){document.querySelectorAll('.color-opt').forEach(o=>o.classList.remove('selected'));el.classList.add('selected');}
function saveEvent(iso,id){
  const title=document.getElementById('ev-title').value.trim();if(!title)return;
  const time=document.getElementById('ev-time').value;const remind=document.getElementById('ev-remind').value==='1';
  const note=document.getElementById('ev-note').value.trim();const colorEl=document.querySelector('.color-opt.selected');const color=colorEl?colorEl.dataset.cid:'blue';
  if(!S.events[iso])S.events[iso]=[];
  if(id){const ev=S.events[iso].find(x=>x.id===id);if(ev){ev.title=title;ev.time=time;ev.remind=remind;ev.note=note;ev.color=color;}}
  else S.events[iso].push({id:S.nextEventId++,title,time,remind,note,color});
  scheduleSave();closeModal();render();scheduleNotifications();showToast(id?'Evento actualizado':'Evento agregado ✓');
  if(remind&&Notification.permission!=='granted')requestNotifPerms();
}
function deleteEvent(iso,id){if(!S.events[iso])return;S.events[iso]=S.events[iso].filter(x=>x.id!==id);if(!S.events[iso].length)delete S.events[iso];scheduleSave();render();showToast('Evento eliminado');}
function closeModal(){document.getElementById('modal-container').innerHTML='';}

// ── NOTIFICATIONS ─────────────────────────────────────────────
async function requestNotifPerms(){if(!('Notification' in window))return;if(Notification.permission==='default')await Notification.requestPermission();}
function scheduleNotifications(){
  Object.values(notifScheduled).forEach(clearTimeout);notifScheduled={};
  const now=new Date();
  Object.entries(S.events).forEach(([iso,evts])=>{evts.forEach(ev=>{if(!ev.remind||!ev.time)return;const[h,m]=ev.time.split(':').map(Number);const evDate=isoToDate(iso);evDate.setHours(h,m-15,0,0);const diff=evDate-now;if(diff>0&&diff<86400000*7){notifScheduled[ev.id]=setTimeout(()=>{if(Notification.permission==='granted')new Notification('Día a Día — '+ev.title,{body:`En 15 min · ${ev.time}`});},diff);}});});
}

// ── TOAST ─────────────────────────────────────────────────────
let toastTimer;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}

// ── INIT ──────────────────────────────────────────────────────
cacheLoad();render();syncFromSheet();setInterval(syncFromSheet,60000);requestNotifPerms();
const rt=Object.entries(S.timers).find(([id,t])=>t.running&&t.date===todayISO());
if(rt){floatHabitId=parseInt(rt[0]);showFloatTimer();}
</script>
</body>
